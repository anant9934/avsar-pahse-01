name: Avsar CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, Lint, Typecheck & Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Clean Dependencies
        run: npm ci

      - name: Start Next.js Development Server for Integration Tests
        run: |
          npm run dev &
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health/live > /dev/null; then
              echo "Next.js dev server ready on http://localhost:3000"
              break
            fi
            sleep 1
          done

      - name: Execute Test Suite
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript Types
        run: npx tsc --noEmit

      - name: Verify Production Next.js Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependency Security Audit
        run: npm audit --audit-level=high
